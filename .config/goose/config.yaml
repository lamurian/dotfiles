GOOSE_TELEMETRY_ENABLED: true
extensions:
  code_execution:
    enabled: true
    type: platform
    name: code_execution
    description: Goose will make extension calls through code execution, saving tokens
    display_name: Code Mode
    bundled: true
  extensionmanager:
    enabled: true
    type: platform
    name: Extension Manager
    description: Enable extension management tools for discovering, enabling, and disabling extensions
    display_name: Extension Manager
    bundled: true
  summarize:
    enabled: true
    type: platform
    name: summarize
    description: Load files/directories and get an LLM summary in a single call
    display_name: Summarize
    bundled: true
  orchestrator:
    enabled: false
    type: platform
    name: orchestrator
    description: 'Manage agent sessions: list, view, start, send messages, interrupt, and stop agents'
    display_name: Orchestrator
    bundled: true
  summon:
    enabled: true
    type: platform
    name: summon
    description: Load knowledge and delegate tasks to subagents
    display_name: Summon
    bundled: true
  analyze:
    enabled: true
    type: platform
    name: analyze
    description: 'Analyze code structure with tree-sitter: directory overviews, file details, symbol call graphs'
    display_name: Analyze
    bundled: true
  todo:
    enabled: true
    type: platform
    name: todo
    description: Enable a todo list for goose so it can keep track of what it is doing
    display_name: Todo
    bundled: true
  apps:
    enabled: true
    type: platform
    name: apps
    description: Create and manage custom Goose apps through chat. Apps are HTML/CSS/JavaScript and run in sandboxed windows.
    display_name: Apps
    bundled: true
  chatrecall:
    enabled: false
    type: platform
    name: chatrecall
    description: Search past conversations and load session summaries for contextual memory
    display_name: Chat Recall
    bundled: true
  developer:
    enabled: true
    type: builtin
    name: developer
    description: Write and edit files, and execute shell commands
    display_name: Developer
    timeout: null
    bundled: true
  skills:
    enabled: true
    type: platform
    name: skills
    description: Discover and provide skill instructions from filesystem and builtins
    display_name: Skills
    bundled: true
  autovisualiser:
    enabled: true
    type: builtin
    name: autovisualiser
    description: Data visualisation and UI generation tools
    display_name: Auto Visualiser
    timeout: 300
    bundled: true
  scheduler:
    enabled: false
    type: platform
    name: scheduler
    description: Create and manage scheduled recipe execution
    display_name: Scheduler
    bundled: true
  councilofmine:
    enabled: true
    type: stdio
    name: Council of Mine
    description: Spawn an LLM council to debate on given topic
    cmd: uvx
    args:
    - --from
    - git+https://github.com/block/mcp-council-of-mine
    - mcp_council_of_mine
    envs: {}
    env_keys: []
    timeout: 300
    cwd: null
    bundled: null
  tom:
    enabled: true
    type: platform
    name: tom
    description: Inject custom context into every turn via GOOSE_MOIM_MESSAGE_TEXT and GOOSE_MOIM_MESSAGE_FILE environment variables
    display_name: Top Of Mind
    bundled: true
  goosedocs:
    enabled: true
    type: stdio
    name: Goose Docs
    description: Documentation of Goose AI agent to let the agent answers questions about itself
    cmd: npx
    args:
    - mcp-remote
    - https://block.gitmcp.io/goose/
    envs: {}
    env_keys: []
    timeout: 300
    cwd: null
    bundled: null
GOOSE_THINKING_EFFORT: high
active_provider: opencode_go
providers:
  opencode_go:
    enabled: true
    model: deepseek-v4-flash
    configured: true
GOOSE_MODE: auto
GOOSE_DISABLE_KEYRING: ''
plugins:
  /home/lam/.agents/plugins/sandbox:
    enabled: true
  /home/lam/git-repo/dotfiles/.agents/plugins/sandbox:
    enabled: true
